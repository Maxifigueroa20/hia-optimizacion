services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    shm_size: 256mb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hotel_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - volPostgres:/var/lib/postgresql/data
    networks:
      - redPostgres

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: user@domain.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    depends_on:
      - postgres
    networks:
      - redPostgres

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    networks:
      - redPostgres

networks:
  redPostgres:
    name: redPostgres
    driver: bridge

volumes:
  volPostgres:
    name: volPostgres
